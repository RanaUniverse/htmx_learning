<!doctype html>
<html lang="en" hx-headers='{"X-CSRF-TOKEN": "Token_XYZ"}
'>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css' ) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sweetalert2.min.css' ) }}">

    <style nonce="{{g.nonce}}">
        .htmx-indicator {
            display: none;
        }

        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator {
            display: inline-block !important;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .hero-section {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            padding: 100px 0;
        }

        .footer {
            background: #212529;
            color: #adb5bd;
        }

        .footer a {
            color: #ffffff;
            text-decoration: none;
        }

        .footer a:hover {
            color: #0d6efd;
        }
    </style>

    <title>Document</title>




</head>

<body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"> {{ site_name }} </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item">
                        <a class="nav-link active" href="/">
                            {{ now_str_time }}
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/rana">Rana Universe</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/about">About</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/services">Services</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/contact">Contact</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <!-- Footer -->
    <footer class="footer py-4 mt-auto">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-md-6 text-center text-md-start">
                    © 2026 Rana Universe. All Rights Reserved.
                </div>

                <div class="col-md-6 text-center text-md-end">
                    <a href="#">Privacy Policy</a> | <a href="#">Terms</a> |
                    <a href="#">Contact</a>
                </div>
            </div>
        </div>
    </footer>



    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js' ) }}">
    </script>

    <script src="{{ url_for('static', filename='js/htmx.min.js' ) }}">
    </script>

    <script src="{{ url_for('static', filename='js/sweetalert2.min.js' ) }}">
    </script>




    <script nonce="{{g.nonce}}">
        document.addEventListener("DOMContentLoaded", () => {
            const box = document.getElementById("box");
            if (!box) return; // 👈 prevents all errors

            let timer;

            box.addEventListener("mouseenter", () => {
                clearTimeout(timer);

                timer = setTimeout(() => {
                    htmx.trigger(box, "searchNow");
                }, 500);
            });

            box.addEventListener("mouseleave", () => {
                clearTimeout(timer);
            });
        });
    </script>


    {% block my_script %}
    {% endblock %}

</body>

</html>
