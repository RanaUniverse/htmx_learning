templates/base.html

#}

<!doctype html>
<html lang="en" hx-headers='{"X-CSRF-TOKEN": "Token_XYZ"}
'>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css' ) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sweetalert2.min.css' ) }}">

    <style nonce="{{g.nonce}}">
        .htmx-indicator {
            display: none;
        }

        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator {
            display: inline-block !important;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .hero-section {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            padding: 100px 0;
        }

        .footer {
            background: #212529;
            color: #adb5bd;
        }

        .footer a {
            color: #ffffff;
            text-decoration: none;
        }

        .footer a:hover {
            color: #0d6efd;
        }

        /* Inside your <style> block */
        .my-responsive-icon {
            width: 20px;
            /* Or use 2.5em if you want it to match text size */
            height: auto;
        }

        /* Pencil icon */
        .edit-btn svg {
            transition: color .3s;
        }

        /* Animation while editing */
        .edit-btn.writing-animation svg {
            animation: writing 1.8s ease infinite;
            color: royalblue;
        }

        /* Animation on hover */
        .edit-btn:hover svg {
            animation: writing 1.8s ease infinite;
            color: royalblue;
        }

        /* Button styling */
        .edit-btn {
            background: transparent;
            border: none;
            padding: 10px;
            border-radius: 50%;
            cursor: pointer;
            /* Better than cursor:none */
        }


        @keyframes writing {
            0% {
                transform: translate(0, 0) rotate(0deg);
            }

            12% {
                transform: translate(3px, 1px) rotate(-12deg);
            }

            24% {
                transform: translate(6px, -1px) rotate(-18deg);
            }

            36% {
                transform: translate(9px, 1px) rotate(-10deg);
            }

            48% {
                transform: translate(12px, -1px) rotate(-18deg);
            }

            60% {
                transform: translate(15px, 1px) rotate(-10deg);
            }

            72% {
                transform: translate(18px, -1px) rotate(-18deg);
            }

            84% {
                transform: translate(10px, 0) rotate(-8deg);
            }

            100% {
                transform: translate(0, 0) rotate(0deg);
            }
        }
    </style>

    <title>Document</title>




</head>

<body>
    {% include 'partials/_navbar.html' %}


    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include 'partials/_footer.html' %}

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js' ) }}">
    </script>

    <script src="{{ url_for('static', filename='js/htmx.min.js' ) }}">
    </script>

    <script src="{{ url_for('static', filename='js/sweetalert2.min.js' ) }}">
    </script>




    <script nonce="{{g.nonce}}">
        document.addEventListener("DOMContentLoaded", () => {
            const box = document.getElementById("box");
            if (!box) return; // 👈 prevents all errors

            let timer;

            box.addEventListener("mouseenter", () => {
                clearTimeout(timer);

                timer = setTimeout(() => {
                    htmx.trigger(box, "searchNow");
                }, 500);
            });

            box.addEventListener("mouseleave", () => {
                clearTimeout(timer);
            });
        });
    </script>


    {% block my_script %}
    {% endblock %}

</body>

</html>
