<!doctype html>
<html lang="en" hx-headers='{"X-CSRF-TOKEN": "Token_XYZ"}
'>

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />


    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css' ) }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sweetalert2.min.css' ) }}">

    <style nonce="{{g.nonce}}">
        .htmx-indicator {
            display: none;
        }

        .htmx-request .htmx-indicator,
        .htmx-request.htmx-indicator {
            display: inline-block !important;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        main {
            flex: 1;
        }

        .hero-section {
            background: linear-gradient(135deg, #0d6efd, #6610f2);
            color: white;
            padding: 100px 0;
        }

        .footer {
            background: #212529;
            color: #adb5bd;
        }

        .footer a {
            color: #ffffff;
            text-decoration: none;
        }

        .footer a:hover {
            color: #0d6efd;
        }
    </style>

    <title>Document</title>




</head>

<body>
    {% include 'partials/_navbar.html' %}


    <main>
        {% block content %}
        {% endblock %}
    </main>

    {% include 'partials/_footer.html' %}

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js' ) }}">
    </script>

    <script src="{{ url_for('static', filename='js/htmx.min.js' ) }}">
    </script>

    <script src="{{ url_for('static', filename='js/sweetalert2.min.js' ) }}">
    </script>




    <script nonce="{{g.nonce}}">
        document.addEventListener("DOMContentLoaded", () => {
            const box = document.getElementById("box");
            if (!box) return; // 👈 prevents all errors

            let timer;

            box.addEventListener("mouseenter", () => {
                clearTimeout(timer);

                timer = setTimeout(() => {
                    htmx.trigger(box, "searchNow");
                }, 500);
            });

            box.addEventListener("mouseleave", () => {
                clearTimeout(timer);
            });
        });
    </script>


    {% block my_script %}
    {% endblock %}

</body>

</html>
