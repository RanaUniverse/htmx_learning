{% extends 'base.html' %} {% block content %}
<h1>Thanks</h1>

<div class="htmx-indicator" id="spinner">
    <img
        src="{{ url_for('static', filename='animation/rana_round.svg' ) }}"
        alt="Loading"
    />
    <br />
</div>

<h1>Try it</h1>
<input
    type="text"
    name="q"
    placeholder="Search..."
    hx-get="/search"
    hx-trigger="input delay:1s, mouseenter delay:1s"
    hx-target="#results"
    hx-indicator="#spinner"
/>

<div id="results">Old Data Nothing Now...</div>

<button
    hx-get="/click"
    hx-target="#results"
    hx-swap="innerHTML"
    hx-indicator="#spinner"
>
    1 Click Me!
</button>

<div id="box" hx-get="/search" hx-trigger="searchNow" hx-target="#results">
    Mouse Enter Here
</div>
<!-- this custom event is in the script in the base file -->
<p>New below seracth with keyup</p>

<input
    placeholder="serach here for with Enter"
    hx-target="#results"
    hx-get="/search"
    hx-trigger="keyup[key == 'Enter'], input changed delay:1s"
    hx-indicator="#spinner"
    hx-swap="beforeend"
    name="q"
/>

<p>New Link Below</p>

<a
    hx-post="/new-link"
    hx-target="#results"
    hx-indicator="#spinner"
    hx-swap="afterend"
>
    New link
</a>

{% endblock %}
