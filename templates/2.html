<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>HTMX Demo</title>

        <!-- Bootstrap 5 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
        />

        <!-- HTMX -->
        <script src="{{ url_for('static', filename='js/htmx_latent.js' ) }}"></script>
    </head>

    <body class="bg-light">
        <div class="container py-5">
            <h1 class="mb-4">HTMX + Flask Demo</h1>

            <!-- ========================= -->
            <!-- 1. Hypermedia Control (click GET) -->
            <!-- ========================= -->
            <button
                class="btn btn-primary"
                hx-get="/messages"
                hx-target="#output"
            >
                Load Messages
            </button>

            <!-- ========================= -->
            <!-- Output area -->
            <!-- ========================= -->
            <div id="output" class="mt-3 alert alert-info">
                Result will appear here
            </div>

            <hr />

            <!-- ========================= -->
            <!-- 2. Trigger + delay + key filter -->
            <!-- ========================= -->
            <input
                class="form-control"
                name="q"
                placeholder="Search..."
                hx-get="/search"
                hx-trigger="input delay:500ms, keyup[key=='Enter']"
                hx-target="#search-results"
            />

            <div id="search-results" class="mt-3"></div>

            <div>
                <form>
                    <div class="form-group">
                        <label for="exampleInputEmail1">Email address</label>
                        <input
                            type="email"
                            class="form-control"
                            id="exampleInputEmail1"
                            aria-describedby="emailHelp"
                            placeholder="Enter email"
                        />
                        <small id="emailHelp" class="form-text text-muted"
                            >We'll never share your email with anyone
                            else.</small
                        >
                    </div>
                    <div class="form-group">
                        <label for="exampleInputPassword1">Password</label>
                        <input
                            type="password"
                            class="form-control"
                            id="exampleInputPassword1"
                            placeholder="Password"
                        />
                    </div>
                    <div class="form-group form-check">
                        <input
                            type="checkbox"
                            class="form-check-input"
                            id="exampleCheck1"
                        />
                        <label class="form-check-label" for="exampleCheck1"
                            >Check me out</label
                        >
                    </div>
                    <button type="submit" class="btn btn-primary">
                        Submit
                    </button>
                </form>
            </div>
            <form>
                <div class="form-group">
                    <label for="exampleInputEmail1">Email address</label>
                    <input
                        type="email"
                        class="form-control"
                        id="exampleInputEmail1"
                        aria-describedby="emailHelp"
                        placeholder="Enter email"
                    />
                    <small id="emailHelp" class="form-text text-muted"
                        >We'll never share your email with anyone else.</small
                    >
                </div>
                <div class="form-group">
                    <label for="exampleInputPassword1">Password</label>
                    <input
                        type="password"
                        class="form-control"
                        id="exampleInputPassword1"
                        placeholder="Password"
                    />
                </div>
                <div class="form-group form-check">
                    <input
                        type="checkbox"
                        class="form-check-input"
                        id="exampleCheck1"
                    />
                    <label class="form-check-label" for="exampleCheck1"
                        >Check me out</label
                    >
                </div>
                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
            <hr />

            <!-- ========================= -->
            <!-- 3. Trigger filter (Shift click) -->
            <!-- ========================= -->
            <div
                class="p-3 bg-warning mt-3"
                hx-get="/shift_clicked"
                hx-target="#shift-result"
                hx-trigger="click[shiftKey]"
            >
                <button>Shift + Click Me</button>
            </div>

            <div id="shift-result" class="mt-2"></div>

            <hr />

            <!-- ========================= -->
            <!-- 4. Load on page load (special event) -->
            <!-- ========================= -->
            <div hx-get="/welcome" hx-trigger="load" hx-target="#welcome"></div>

            <div id="welcome" class="alert alert-success mt-3"></div>

            <hr />

            <!-- ========================= -->
            <!-- 5. Revealed trigger -->
            <!-- ========================= -->
            <div
                hx-get="/lazy"
                hx-trigger="revealed"
                hx-target="#lazy"
                class="mt-5 p-3 bg-light border"
            >
                Scroll to load me
            </div>

            <div id="lazy" class="mt-2"></div>
        </div>
    </body>
</html>
